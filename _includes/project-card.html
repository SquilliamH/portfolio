<a class="card" href="{{ include.p.url | relative_url }}">
  <div class="card-media">
    {% if include.p.thumbnail %}
      <img src="{{ include.p.thumbnail | relative_url }}" alt="" loading="lazy">
    {% else %}
      <div class="card-placeholder" aria-hidden="true">{{ include.p.title | slice: 0, 1 }}</div>
    {% endif %}
  </div>
  <div class="card-body">
    {% if include.p.kind %}<span class="chip">{{ include.p.kind }}</span>{% endif %}
    <h3>{{ include.p.title }}</h3>
    <p>{{ include.p.summary }}</p>
    <p class="card-meta">{{ include.p.context }}{% if include.p.dates %} · {{ include.p.dates }}{% endif %}</p>
  </div>
</a>
