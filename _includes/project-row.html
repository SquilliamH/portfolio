<a class="row" href="{{ include.p.url | relative_url }}">
  {% if include.p.thumbnail %}
    <img class="row-thumb" src="{{ include.p.thumbnail | relative_url }}" alt="" loading="lazy">
  {% else %}
    <div class="row-thumb ph" aria-hidden="true">{{ include.p.title | slice: 0, 2 }}</div>
  {% endif %}
  <div>
    <h3>{{ include.p.title }}</h3>
    <p>{{ include.p.summary }}</p>
    <p class="row-meta">{{ include.p.context }}{% if include.p.dates %} · {{ include.p.dates }}{% endif %}</p>
  </div>
</a>
