# Site-wide settings. Anything here is available in templates as site.<name>,
# for example {{ site.title }}.
title: William Harris
description: Mechanical engineer building robotic hardware for search and rescue and medical devices.
email: wlharris03@gmail.com
linkedin: https://www.linkedin.com/in/williamlharris3rd/
github: https://github.com/SquilliamH
resume: /assets/William_Harris_Resume.pdf

# Served at https://www.williamlh.com (custom domain, see CNAME).
url: "https://www.williamlh.com"
baseurl: ""

# A collection is a folder of similar pages. Every file in _projects/
# becomes a page at /projects/<file-name>/ and shows up in site.projects.
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Any page in _projects uses the project layout unless it says otherwise.
defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

markdown: kramdown
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - archive
  - Portfolio_Stuff

plugins:
  - jekyll-sitemap
