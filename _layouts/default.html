<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.summary | default: site.description }}">
  <meta name="theme-color" content="#0a6fc2">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.summary | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ page.thumbnail | default: '/assets/img/morphing-leg/thumb.jpg' | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="{{ '/assets/img/favicon-32.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/favicon.png' | relative_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="site-name" href="{{ '/' | relative_url }}"><span class="logo" aria-hidden="true"></span>William Harris</a>
      <nav aria-label="Main">
        <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>about</a>
        <a href="{{ '/projects/' | relative_url }}"{% if page.url contains "/projects/" %} aria-current="page"{% endif %}>projects</a>
        <a href="{{ '/publications/' | relative_url }}"{% if page.url contains "/publications/" %} aria-current="page"{% endif %}>publications</a>
        <a href="{{ site.resume | relative_url }}">resume</a>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer" id="contact">
    <div class="wrap footer-inner">
      <p class="footer-lede">Open to full-time roles and internships in medical robotics and medical device engineering.</p>
      <ul class="contact-links">
        <li><a href="mailto:{{ site.email }}">{{ site.email }}</a></li>
        <li><a href="{{ site.linkedin }}">LinkedIn</a></li>
        <li><a href="{{ site.github }}">GitHub</a></li>
        <li><a href="{{ site.resume | relative_url }}">Resume (PDF)</a></li>
      </ul>
    </div>
  </footer>
</body>
</html>
